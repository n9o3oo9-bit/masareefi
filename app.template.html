<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصاريفي">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="تطبيق لمتابعة وتقسيم المصاريف الشخصية على دفعات الدخل">
<title>مصاريفي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%232FCE65'/%3E%3Cpath d='M26 38h48v34H26z' fill='none' stroke='%2314161a' stroke-width='7' stroke-linejoin='round'/%3E%3Cpath d='M26 38l10-10h38l-10 10' fill='none' stroke='%2314161a' stroke-width='7' stroke-linejoin='round'/%3E%3Ccircle cx='62' cy='55' r='5' fill='%2314161a'/%3E%3C/svg%3E">
<style>
/*FONT_CSS*/

/* ============================ الأساسيات ============================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --sans:'Thmanyah Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --display:'Thmanyah Display',var(--sans);

  --bg:#101216;       --bg2:#171a20;      --card:#1c2027;
  --card2:#232830;    --line:#2c323c;     --line2:#39414d;
  --txt:#eef1f5;      --txt2:#a4adbb;     --txt3:#6d7787;
  --accent:#2FCE65;   --warn:#f5a524;     --danger:#f04f5b;   --info:#5aa9f7;
  --shadow:0 10px 30px -12px rgba(0,0,0,.7);
  --r:16px;
}
html[data-theme="light"]{
  --bg:#f2f4f7;       --bg2:#e9edf2;      --card:#ffffff;
  --card2:#f4f6f9;    --line:#dfe4ea;     --line2:#c9d1da;
  --txt:#171a20;      --txt2:#5b6675;     --txt3:#8e99a8;
  --accent:#17a94b;
  --shadow:0 10px 26px -16px rgba(20,30,50,.35);
}

html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:var(--sans); font-weight:400; font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,select,textarea{background:none;border:none;outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px;border:3px solid var(--bg)}
::selection{background:var(--accent);color:#06130a}

.num{font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;unicode-bidi:isolate}
.disp{font-family:var(--display)}

/* تحذير يظهر فقط إذا فُتح ملف المصدر بدل index.html */
#tplWarn{position:fixed;inset:0;z-index:9999;background:#101216;color:#fff;display:grid;place-items:center;
  padding:30px;text-align:center;font-family:system-ui,sans-serif;line-height:1.9}
#tplWarn b{display:block;font-size:22px;margin-bottom:10px;color:#f5a524}
#tplWarn code{background:#232830;padding:3px 9px;border-radius:6px;font-size:15px}

/* ============================ الأيقونات ============================ */
.ic{width:1.25em;height:1.25em;display:inline-block;vertical-align:-.28em;flex:none;
    stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
    filter:url(#handdrawn)}
.ic.big{width:1.6em;height:1.6em}
#svgdefs{position:absolute;width:0;height:0;overflow:hidden}

/* ============================ الترويسة ============================ */
.topbar{position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px;margin-left:auto;cursor:pointer;
  border-radius:12px;padding:4px 6px;margin-right:-6px;transition:.15s}
.brand:hover{background:var(--card)}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:#06130a;
  display:grid;place-items:center;font-size:20px;box-shadow:0 6px 18px -6px var(--accent);flex:none}
.brand-mark .ic{filter:none;stroke-width:1.9}
.brand .txt{display:flex;flex-direction:column;justify-content:center;gap:1px;min-width:0}
.brand h1{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.28;letter-spacing:-.2px}
.brand small{display:block;color:var(--txt3);font-size:11px;line-height:1.35}

.monthnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
.monthnav button{width:30px;height:30px;border-radius:8px;color:var(--txt2);display:grid;place-items:center;transition:.15s}
.monthnav button:hover{background:var(--card2);color:var(--txt)}
.monthnav .lbl{padding:0 12px;font-weight:600;font-size:14px;min-width:118px;text-align:center;white-space:nowrap}
.monthnav .lbl.now{color:var(--accent)}

.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  color:var(--txt2);display:grid;place-items:center;font-size:17px;transition:.15s;position:relative}
.iconbtn:hover{color:var(--txt);border-color:var(--line2);transform:translateY(-1px)}

.syncbtn{display:flex;align-items:center;gap:7px;padding:0 12px;width:auto;font-size:12.5px;font-weight:600}
.syncbtn .ic{font-size:15px}
.syncbtn[data-s="synced"]{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.syncbtn[data-s="error"]{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.syncbtn[data-s="busy"] .ic{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================ التبويبات ============================ */
.tabs{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:13px 15px 12px;font-size:14.5px;font-weight:500;color:var(--txt3);
  border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{color:var(--txt2)}
.tab.on{color:var(--txt);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--card2);color:var(--txt3);border-radius:20px;padding:1px 7px;font-weight:600}
.tab.on .cnt{background:var(--accent);color:#06130a}

/* ============================ التخطيط ============================ */
main{max-width:1180px;margin:0 auto;padding:24px 20px 90px}
.sect{margin-bottom:28px}
.sect-h{display:flex;align-items:center;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.sect-h h2{font-family:var(--display);font-size:18px;font-weight:700}
.sect-h .ic{color:var(--txt3)}
.sect-h .sp{flex:1}
.hint{color:var(--txt3);font-size:12.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

/* ============================ بطاقات الأرقام ============================ */
.stat{padding:18px 20px 20px;position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;inset:auto auto -40px -40px;width:130px;height:130px;border-radius:50%;
  background:var(--tint,var(--accent));opacity:.07;filter:blur(6px)}
.stat-t{display:flex;align-items:center;gap:8px;color:var(--txt2);font-size:13px;font-weight:500;margin-bottom:10px}
.stat-t .ic{color:var(--tint,var(--accent))}
.stat-v{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.05;letter-spacing:-.8px}
.stat-v .cur{font-family:var(--sans);font-size:14px;font-weight:500;color:var(--txt3);margin-right:6px;letter-spacing:0}
.stat-s{color:var(--txt3);font-size:12.5px;margin-top:7px}
.stat.pos .stat-v{color:var(--accent)}
.stat.neg .stat-v{color:var(--danger)}

/* ============================ التقدّم ============================ */
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .45s cubic-bezier(.4,0,.2,1)}
.bar i.p{background:var(--accent)}
.bar i.r{background:var(--line2)}
.bar.thin{height:6px}
.bar i.over{background:var(--danger)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--txt2)}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;flex:none}

/* ============================ بطاقة الراتب ============================ */
.pay{padding:17px 19px 19px;display:flex;flex-direction:column;gap:13px}
.pay-h{display:flex;align-items:flex-start;gap:11px}
.pay-day{width:46px;height:46px;border-radius:13px;background:var(--card2);border:1px solid var(--line);
  display:grid;place-items:center;line-height:1;flex:none}
.pay-day b{font-family:var(--display);font-size:19px;font-weight:700;color:var(--pc,var(--accent))}
.pay-day s{display:block;font-size:9px;color:var(--txt3);text-decoration:none;margin-top:2px}
.pay-h .t{flex:1;min-width:0}
.pay-h .t b{display:block;font-size:14.5px;font-weight:600}
.pay-h .t span{color:var(--txt3);font-size:12px}
.pay-h .amt{font-family:var(--display);font-size:20px;font-weight:700;white-space:nowrap}
.pay-rows{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.pay-row{display:flex;align-items:center;gap:10px;padding:8px 9px;border-radius:9px;transition:.14s;width:100%;text-align:right}
.pay-row:hover{background:var(--card2)}
.pay-row .ic{color:var(--txt3);font-size:15px}
.pay-row .nm{flex:1;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pay-row .vl{font-size:13.5px;font-weight:600;color:var(--txt2)}
.pay-row.done .nm{color:var(--txt3);text-decoration:line-through;text-decoration-color:var(--line2)}
.pay-row.done .vl{color:var(--accent)}
.pay-foot{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;
  padding-top:11px;border-top:1px dashed var(--line);color:var(--txt2)}

.chk{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--line2);flex:none;
  display:grid;place-items:center;color:transparent;transition:.16s}
.chk:hover{border-color:var(--accent);transform:scale(1.08)}
.chk .ic{width:14px;height:14px;stroke-width:2.6;filter:none}
.chk.on{background:var(--accent);border-color:var(--accent);color:#06130a}

/* ============================ الجدول ============================ */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:760px}
thead th{background:var(--card2);padding:12px 14px;text-align:right;font-size:12px;font-weight:600;
  color:var(--txt2);border-bottom:1px solid var(--line);white-space:nowrap}
thead th small{display:block;font-weight:400;font-size:10.5px;color:var(--txt3);margin-top:2px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--card2)}
tbody tr.tot td{background:var(--card2);font-weight:700;border-top:1.5px solid var(--line2);border-bottom:none}
tbody tr.tot:hover td{background:var(--card2)}
.cell-item{display:flex;align-items:center;gap:11px;min-width:180px}
.cell-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--ic-c,var(--accent)) 15%,transparent);color:var(--ic-c,var(--accent));font-size:17px}
.cell-item b{font-weight:500;font-size:14px;display:block}
.cell-item i{font-style:normal;color:var(--txt3);font-size:11.5px}
.alloc{display:flex;align-items:center;gap:9px}
.alloc .v{font-size:14px;font-weight:500;min-width:44px}
.alloc.zero .v{color:var(--txt3)}
.alloc.zero .chk{opacity:.25;pointer-events:none}
.rowacts{display:flex;gap:3px;justify-content:flex-end;opacity:.35;transition:.15s}
tr:hover .rowacts,.arch .rowacts,.xitem .rowacts{opacity:1}
.rowacts button{width:29px;height:29px;border-radius:8px;color:var(--txt2);display:grid;place-items:center;font-size:15px}
.rowacts button:hover{background:var(--card);color:var(--txt)}
.rowacts button.del:hover{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill.part{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.no{background:var(--card2);color:var(--txt3)}
.pill .ic{width:12px;height:12px;stroke-width:2.4}

/* ============================ الأزرار ============================ */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;
  font-size:13.5px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--txt);transition:.15s}
.btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#06130a}
.btn.primary:hover{box-shadow:0 8px 22px -8px var(--accent)}
.btn.ghost{background:none}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 12%,transparent)}
.btn.sm{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.note{display:flex;gap:13px;padding:15px 17px;border-radius:var(--r);align-items:flex-start;
  border:1px solid color-mix(in srgb,var(--nc,var(--accent)) 30%,transparent);
  background:color-mix(in srgb,var(--nc,var(--accent)) 9%,var(--card))}
.note .ic{color:var(--nc,var(--accent));font-size:20px;margin-top:1px}
.note b{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.note p{font-size:13px;color:var(--txt2);line-height:1.65}

.empty{padding:46px 20px;text-align:center;color:var(--txt3)}
.empty .ic{font-size:40px;opacity:.4;margin-bottom:12px}
.empty p{font-size:13.5px}

/* ============================ الأسبوعي ============================ */
.wk{padding:19px 21px 21px}
.wk-h{display:flex;align-items:center;gap:13px;margin-bottom:17px}
.wk-h .cell-ic{width:40px;height:40px;font-size:19px}
.wk-h .t{flex:1;min-width:0}
.wk-h .t b{display:block;font-size:15.5px;font-weight:600}
.wk-h .t span{font-size:12px;color:var(--txt3)}
.wk-body{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg) scaleX(-1);width:100%;height:100%}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .trk{stroke:var(--card2)}
.ring .val{stroke:var(--rc,var(--accent));transition:stroke-dasharray .5s cubic-bezier(.4,0,.2,1)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.15}
.ring .mid b{font-family:var(--display);font-size:25px;font-weight:700;color:var(--rc,var(--accent))}
.ring .mid s{display:block;font-size:10.5px;color:var(--txt3);text-decoration:none;margin-top:3px}
.wk-side{flex:1;min-width:200px;display:flex;flex-direction:column;gap:11px}
.wk-kv{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 12px;background:var(--bg2);border-radius:10px}
.wk-kv b{font-weight:600}
.wk-kv.hi{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.wk-kv.bad{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:17px}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:9px 4px;text-align:center;transition:.15s}
.day:hover{border-color:var(--line2)}
.day.today{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.day.future{opacity:.4}
.day s{display:block;font-size:10.5px;color:var(--txt3);text-decoration:none}
.day b{display:block;font-size:14px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.day.zero b{color:var(--txt3);font-weight:400}

.weeks{display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.wkchip{flex:1;min-width:96px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 11px}
.wkchip.cur{border-color:var(--accent)}
.wkchip s{display:block;font-size:10.5px;color:var(--txt3);text-decoration:none;margin-bottom:5px}
.wkchip b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.wkchip .bar{margin-top:7px;height:5px}

.log{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:none}
.log .nm{flex:1;min-width:0}
.log .nm b{display:block;font-size:13.5px;font-weight:500}
.log .nm span{font-size:11.5px;color:var(--txt3)}
.log .vl{font-weight:600;font-size:14.5px}

/* ============================ النافذة ============================ */
.ov{position:fixed;inset:0;z-index:100;background:rgba(6,8,12,.66);backdrop-filter:blur(5px);
  display:grid;place-items:center;padding:20px;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.modal{background:var(--card);border:1px solid var(--line);border-radius:20px;width:100%;max-width:520px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 70px -25px rgba(0,0,0,.85);animation:pop .22s cubic-bezier(.2,.9,.3,1)}
.modal.wide{max-width:620px}
.modal-h{padding:19px 22px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.modal-h h3{font-family:var(--display);font-size:18px;font-weight:700;flex:1}
.modal-h .ic{color:var(--accent);font-size:19px}
.modal-b{padding:20px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:17px}
.modal-f{padding:15px 22px 19px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}
.modal-f .sp{flex:1}

.field label{display:block;font-size:12.5px;font-weight:600;color:var(--txt2);margin-bottom:7px}
.field .inp{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;
  font-size:14.5px;transition:.15s}
.field .inp:focus{border-color:var(--accent);background:var(--card2)}
.field .inp::placeholder{color:var(--txt3)}
.sub{font-size:11.5px;color:var(--txt3);margin-top:6px;line-height:1.7}
textarea.inp{resize:vertical;min-height:88px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;direction:ltr;text-align:left}

.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px;max-height:172px;overflow-y:auto;padding:3px}
.picker button{aspect-ratio:1;border-radius:11px;background:var(--bg2);border:1.5px solid transparent;
  display:grid;place-items:center;font-size:19px;color:var(--txt2);transition:.14s}
.picker button:hover{background:var(--card2);color:var(--txt)}
.picker button.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}

.allocgrid{display:flex;flex-direction:column;gap:9px}
.allocrow{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:11px;padding:9px 12px}
.allocrow .lb{flex:1;min-width:0;font-size:13.5px}
.allocrow .lb s{display:block;font-size:11px;color:var(--txt3);text-decoration:none}
.allocrow input[type=number]{width:96px;text-align:left;direction:ltr;background:var(--card);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;font-size:14px;font-weight:600}
.allocrow input:focus{border-color:var(--accent)}
.alloctot{display:flex;justify-content:space-between;font-size:13px;padding:11px 13px;background:var(--card2);
  border-radius:11px;font-weight:600}
.alloctot.over{color:var(--danger)}

/* محرّر الدخل */
.incrow{display:flex;gap:8px;align-items:center;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.incrow .nmi{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13.5px}
.incrow .dayi{width:64px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 8px;font-size:13.5px;text-align:center;direction:ltr}
.incrow .amti{width:96px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:14px;font-weight:600;text-align:left;direction:ltr}
.incrow input:focus{border-color:var(--accent)}
.incrow .cap{font-size:10.5px;color:var(--txt3);width:100%}
.incrow .rm{width:30px;height:30px;border-radius:8px;color:var(--txt3);display:grid;place-items:center}
.incrow .rm:hover{color:var(--danger);background:var(--card)}

.switch{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;cursor:pointer}
.switch .track{width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;transition:.2s;flex:none}
.switch .track::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:.2s}
.switch.on .track{background:var(--accent)}
.switch.on .track::after{transform:translateX(-18px)}
.switch .lb{flex:1;font-size:13.5px;font-weight:500}
.switch .lb s{display:block;font-size:11.5px;color:var(--txt3);text-decoration:none;font-weight:400}

.xitem{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.xitem:last-child{border-bottom:none}
.xitem .nm{flex:1;min-width:0}
.xitem .nm b{display:block;font-size:13.5px;font-weight:500}
.xitem .nm span{font-size:11.5px;color:var(--txt3)}
.xitem .vl{font-weight:600;font-size:14px}
.xitem.done .nm b{text-decoration:line-through;color:var(--txt3)}

.arch{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid var(--line)}
.arch:last-child{border-bottom:none}
.arch .nm{flex:1}
.arch .nm b{display:block;font-size:14.5px;font-weight:600}
.arch .nm span{font-size:12px;color:var(--txt3)}
.arch .vl{text-align:left}
.arch .vl b{display:block;font-family:var(--display);font-size:17px;font-weight:700;color:var(--accent)}
.arch .vl span{font-size:11px;color:var(--txt3)}

.toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);z-index:200;
  background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:12px 18px;
  box-shadow:0 16px 40px -12px rgba(0,0,0,.7);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500;
  animation:pop .2s ease;max-width:88vw}
.toast .ic{color:var(--accent);flex:none}
.toast.bad .ic{color:var(--danger)}

.fab{position:fixed;bottom:24px;left:24px;z-index:50;width:56px;height:56px;border-radius:18px;
  background:var(--accent);color:#06130a;display:grid;place-items:center;font-size:25px;
  box-shadow:0 12px 30px -8px var(--accent);transition:.18s}
.fab:hover{transform:translateY(-2px) scale(1.04)}
.fab .ic{filter:none;stroke-width:2.2}

/* ============================ الصفحة التعريفية ============================ */
.land{max-width:1060px;margin:0 auto;padding:0 20px 80px}
.hero{padding:70px 0 56px;text-align:center;position:relative}
.hero::before{content:'';position:absolute;top:-40px;right:50%;transform:translateX(50%);
  width:520px;height:320px;max-width:100%;border-radius:50%;
  background:var(--accent);opacity:.13;filter:blur(90px);pointer-events:none}
.hero-mark{width:76px;height:76px;border-radius:24px;background:var(--accent);color:#06130a;
  display:grid;place-items:center;font-size:40px;margin:0 auto 26px;
  box-shadow:0 18px 44px -14px var(--accent);position:relative}
.hero-mark .ic{filter:none;stroke-width:1.8}
.hero h1{font-family:var(--display);font-size:clamp(38px,7vw,62px);font-weight:700;
  line-height:1.12;letter-spacing:-1.4px;margin-bottom:18px;position:relative}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{font-size:clamp(15px,2.2vw,19px);color:var(--txt2);max-width:620px;margin:0 auto;
  line-height:1.75;position:relative}
.hero-cta{display:flex;gap:12px;justify-content:center;margin-top:34px;flex-wrap:wrap;position:relative}
.btn-lg{padding:14px 26px;border-radius:14px;font-size:15.5px;font-weight:600;
  display:inline-flex;align-items:center;gap:10px;transition:.18s;border:1px solid var(--line)}
.btn-lg.primary{background:var(--accent);border-color:var(--accent);color:#06130a}
.btn-lg.primary:hover{transform:translateY(-2px);box-shadow:0 14px 32px -10px var(--accent)}
.btn-lg.ghost{background:var(--card);color:var(--txt)}
.btn-lg.ghost:hover{border-color:var(--line2);transform:translateY(-2px)}
.btn-lg .ic{font-size:19px}
.hero-note{margin-top:16px;font-size:12.5px;color:var(--txt3);position:relative}

.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:20px}
.feat-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:22px 22px 24px;transition:.2s}
.feat-card:hover{border-color:var(--line2);transform:translateY(-3px)}
.feat-card .cell-ic{width:44px;height:44px;font-size:22px;border-radius:13px;margin-bottom:15px}
.feat-card b{display:block;font-family:var(--display);font-size:16.5px;font-weight:700;margin-bottom:7px}
.feat-card p{font-size:13.5px;color:var(--txt2);line-height:1.75}

.land-h{text-align:center;margin:62px 0 26px}
.land-h h2{font-family:var(--display);font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.6px}
.land-h p{color:var(--txt3);font-size:14px;margin-top:9px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;position:relative}
.step::before{counter-increment:s;content:counter(s);position:absolute;top:20px;left:22px;
  font-family:var(--display);font-size:42px;font-weight:700;color:var(--accent);opacity:.18;line-height:1}
.step b{display:block;font-size:15.5px;font-weight:600;margin-bottom:8px}
.step p{font-size:13.5px;color:var(--txt2);line-height:1.75}

.land-foot{margin-top:64px;padding:30px 26px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--card);text-align:center}
.land-foot .ic{font-size:26px;color:var(--accent);margin-bottom:12px}
.land-foot b{display:block;font-family:var(--display);font-size:18px;font-weight:700;margin-bottom:8px}
.land-foot p{font-size:13.5px;color:var(--txt2);line-height:1.8;max-width:560px;margin:0 auto}

/* ============================ رحلة الإعداد ============================ */
.wiz{max-width:660px;margin:0 auto;padding:34px 20px 90px}
.wiz-top{display:flex;align-items:center;gap:13px;margin-bottom:26px}
.wiz-top .brand-mark{width:42px;height:42px;font-size:22px}
.wiz-top .t{flex:1;min-width:0}
.wiz-top .t b{display:block;font-family:var(--display);font-size:19px;font-weight:700}
.wiz-top .t span{font-size:12.5px;color:var(--txt3)}
.wiz-dots{display:flex;gap:7px;margin-bottom:30px}
.wiz-dots i{flex:1;height:4px;border-radius:99px;background:var(--card2);transition:.3s}
.wiz-dots i.on{background:var(--accent)}
.wiz-dots i.done{background:var(--accent);opacity:.45}

.wiz h2{font-family:var(--display);font-size:clamp(23px,4.4vw,30px);font-weight:700;
  letter-spacing:-.6px;margin-bottom:11px;line-height:1.25}
.wiz .lead{font-size:14.5px;color:var(--txt2);line-height:1.8;margin-bottom:26px}
.wiz-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:19px 20px;margin-bottom:13px;box-shadow:var(--shadow)}
.wiz-foot{display:flex;gap:10px;align-items:center;margin-top:28px;flex-wrap:wrap}
.wiz-foot .sp{flex:1}
.wiz-skip{color:var(--txt3);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.wiz-skip:hover{color:var(--txt2)}

.srcrow{display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap;
  background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:10px}
.srcrow .f{display:flex;flex-direction:column;gap:5px}
.srcrow .f label{font-size:11px;color:var(--txt3);font-weight:600}
.srcrow .f.nm{flex:1;min-width:130px}
.srcrow input{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14px;width:100%}
.srcrow input:focus{border-color:var(--accent)}
.srcrow .f.dy input,.srcrow .f.am input{text-align:left;direction:ltr;font-weight:600}
.srcrow .f.dy{width:76px}.srcrow .f.am{width:108px}
.srcrow .rm{width:32px;height:32px;border-radius:9px;color:var(--txt3);display:grid;place-items:center;align-self:flex-end;margin-bottom:3px}
.srcrow .rm:hover{color:var(--danger);background:var(--card)}

.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px}
.catchip{display:flex;flex-direction:column;align-items:center;gap:8px;padding:15px 8px;
  background:var(--bg2);border:1.5px solid var(--line);border-radius:13px;
  font-size:12.5px;font-weight:500;color:var(--txt2);transition:.15s;text-align:center;line-height:1.35}
.catchip .ic{font-size:22px;color:var(--txt3)}
.catchip:hover{border-color:var(--line2);color:var(--txt)}
.catchip.on{border-color:var(--accent);color:var(--txt);background:color-mix(in srgb,var(--accent) 11%,transparent)}
.catchip.on .ic{color:var(--accent)}

.pickhead{padding:2px 2px 12px;border-bottom:1px dashed var(--line);margin-bottom:12px}
.pickhead b{display:block;font-size:14px;font-weight:600;margin-bottom:4px}
.pickhead p{font-size:12.5px;color:var(--txt3);line-height:1.6}
.picklabels{display:flex;align-items:center;gap:11px;padding:0 13px 7px;
  font-size:11px;font-weight:600;color:var(--txt3)}
.picklabels .l1{margin-right:45px;flex:1;min-width:110px}
.picklabels .l2{width:100px;text-align:center}
.picklabels .l3{width:150px;text-align:center}
@media(max-width:640px){ .picklabels{display:none} }
.pickrow{display:flex;align-items:center;gap:11px;background:var(--bg2);border:1px solid var(--line);
  border-radius:12px;padding:11px 13px;margin-bottom:9px;flex-wrap:wrap}
.pickrow .cell-ic{width:34px;height:34px;font-size:17px}
.pickrow .nm{flex:1;min-width:110px;font-size:14px;font-weight:500}
.pickrow .nm input{background:none;border:none;font-size:14px;font-weight:500;width:100%;padding:0}
.pickrow input.amt{width:100px;background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:14px;font-weight:600;text-align:left;direction:ltr}
.pickrow select.src{background:var(--card);border:1px solid var(--line);border-radius:9px;
  padding:8px 10px;font-size:12.5px;max-width:150px}
.pickrow input:focus,.pickrow select:focus{border-color:var(--accent)}
.pickrow .rm{width:30px;height:30px;border-radius:8px;color:var(--txt3);display:grid;place-items:center}
.pickrow .rm:hover{color:var(--danger);background:var(--card)}

.rev{display:flex;justify-content:space-between;align-items:center;padding:14px 17px;
  border-bottom:1px solid var(--line);font-size:14px}
.rev:last-child{border-bottom:none}
.rev b{font-weight:600}
.rev.big{background:var(--card2)}
.rev.big b{font-family:var(--display);font-size:19px}
.rev .g{color:var(--accent)}
.rev .r{color:var(--danger)}

@media(max-width:820px){
  .g3{grid-template-columns:1fr 1fr}
  .g3>*:first-child{grid-column:span 2}
  .feat,.steps{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  body{font-size:14.5px}
  main{padding:18px 14px 96px}
  .topbar-in{padding:12px 14px;gap:9px}
  .tabs{padding:0 14px}
  .brand h1{font-size:22px}
  .brand small{display:none}
  .g3,.g2{grid-template-columns:1fr}
  .g3>*:first-child{grid-column:auto}
  .stat-v{font-size:29px}
  .monthnav .lbl{min-width:92px;font-size:13px}
  .wk-body{gap:16px}
  .ring{width:100px;height:100px}
  .days{grid-template-columns:repeat(4,1fr)}
  .fab{bottom:18px;left:18px}
  .feat,.steps{grid-template-columns:1fr}
  .hero{padding:46px 0 40px}
  .land,.wiz{padding-left:14px;padding-right:14px}
  .btn-lg{width:100%;justify-content:center}
  .catgrid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}
@media print{
  .topbar,.tabs,.rowacts,.btn,.iconbtn,.fab{display:none!important}
  body{background:#fff;color:#000}
}
</style>

<header class="topbar">

    </div>
    <button class="iconbtn syncbtn" id="bSync" data-s="off" title="المزامنة"></button>

  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="app"></main>

const AR_MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AR_DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

const ym = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => iso(new Date());
const monthLabel = k => { const [y,m]=k.split('-'); return AR_MONTHS[+m-1]+' '+y; };
const shiftMonth = (k,d) => { const [y,m]=k.split('-').map(Number); return ym(new Date(y,m-1+d,1)); };
const parseISO = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };

function weekStart(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+1)%7)); return x; }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function weeksOfMonth(k){
  const [y,m]=k.split('-').map(Number);
  const last=new Date(y,m,0), out=[];
  let s=weekStart(new Date(y,m-1,1));
  while(s<=last){ out.push({start:iso(s), end:iso(addDays(s,6))}); s=addDays(s,7); }
  return out;
}

let S=null, TAB='over';

function normalize(d){
  if(!d || !Array.isArray(d.items)) return emptyState();
  d.v=3;
  if(!d.months) d.months={};
  if(!Array.isArray(d.spend)) d.spend=[];
  if(!Array.isArray(d.incomes)) d.incomes=[];
  // بيانات من نسخة سابقة: من عنده بنود فقد أكمل الإعداد أصلًا
  if(typeof d.onboarded!=='boolean') d.onboarded = d.items.length>0 && d.incomes.length>0;
  if(typeof d.localMode!=='boolean') d.localMode=false;
  d.incomes.forEach((p,i)=>{ p.amount=+p.amount||0; p.day=+p.day||1; p.color=p.color||SRC_COLORS[i%SRC_COLORS.length]; });
  d.items.forEach(i=>{
    if(!i.weekly) i.weekly={enabled:false,budget:0};
    i.weekly.budget=+i.weekly.budget||0;
    if(!i.alloc) i.alloc={};
    d.incomes.forEach(p=>{ i.alloc[p.id]=+i.alloc[p.id]||0; });
  });
  if(!d.current) d.current=ym(new Date());
  if(!d.updatedAt) d.updatedAt=Date.now();
  return d;
}

function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw); }catch(e){}
  S=normalize(S);
  ensureMonth(S.current);
  document.documentElement.dataset.theme=S.theme||'dark';
}
function save(opts){
  if(!(opts&&opts.silent)) S.updatedAt=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ toast('تعذّر الحفظ محليًا','bad'); }
  if(!(opts&&opts.silent)) schedulePush();
}
function ensureMonth(k){
  if(!S.months[k]) S.months[k]={paid:{},extras:[]};
  if(!S.months[k].paid) S.months[k].paid={};
  if(!S.months[k].extras) S.months[k].extras=[];
  return S.months[k];
}
const M = () => ensureMonth(S.current);

/* ═══════════════════════════════════════════════════════════
   الحسابات
   ═══════════════════════════════════════════════════════════ */
const activeItems   = () => S.items.filter(i=>!i.archived);
const archivedItems = () => S.items.filter(i=>i.archived);
const weeklyItems   = () => activeItems().filter(i=>i.weekly && i.weekly.enabled);
const itemTotal     = it => S.incomes.reduce((s,p)=>s+(+it.alloc[p.id]||0),0);
const isPaid        = (id,pid) => !!(M().paid[id] && M().paid[id][pid]);
const payById       = id => S.incomes.find(p=>p.id===id);
const itemById      = id => S.items.find(i=>i.id===id);

const totalIncome  = () => S.incomes.reduce((s,p)=>s+(+p.amount||0),0);
const allocOf      = pid => activeItems().reduce((s,i)=>s+(+i.alloc[pid]||0),0);
const extrasOf     = pid => M().extras.filter(x=>x.pay===pid).reduce((s,x)=>s+(+x.amount||0),0);
const chargedOf    = pid => allocOf(pid)+extrasOf(pid);
const paidOf       = pid => activeItems().reduce((s,i)=>s+(isPaid(i.id,pid)?(+i.alloc[pid]||0):0),0)
                          + M().extras.filter(x=>x.pay===pid&&x.paid).reduce((s,x)=>s+(+x.amount||0),0);
const totalCharged = () => S.incomes.reduce((s,p)=>s+chargedOf(p.id),0);
const totalPaid    = () => S.incomes.reduce((s,p)=>s+paidOf(p.id),0);
const totalFree    = () => totalIncome()-totalCharged();
const freedByArch  = () => archivedItems().reduce((s,i)=>s+itemTotal(i),0);

const spendBetween = (itemId,a,b) => S.spend
  .filter(x=>x.item===itemId && x.date>=a && x.date<=b)
  .reduce((s,x)=>s+(+x.amount||0),0);
const spendOnDay = (itemId,d) => spendBetween(itemId,d,d);

function itemStatus(it){
  const parts=S.incomes.filter(p=>(+it.alloc[p.id]||0)>0);
  if(!parts.length) return 'none';
  const done=parts.filter(p=>isPaid(it.id,p.id)).length;
  return done===0?'no':done===parts.length?'ok':'part';
}

   ═══════════════════════════════════════════════════════════ */
const SYNC={status:'off', uid:null, email:null, applying:false, timer:null, ref:null, unsub:null, fb:null};

function fbConfig(){
  try{ const c=localStorage.getItem(FBKEY); if(c){ const o=JSON.parse(c); if(o&&o.apiKey) return o; } }catch(e){}
  return (FIREBASE_BAKED && FIREBASE_BAKED.apiKey) ? FIREBASE_BAKED : null;
}

function setSync(st,label){
  SYNC.status=st;
  const b=$('#bSync'); if(!b) return;
  const map={
    off:      [ 'cloudoff','بلا مزامنة'],
    busy:     [ 'refresh', 'جارٍ…'],
    signedout:[ 'user',    'سجّل الدخول'],
    synced:   [ 'cloud',   'متزامن'],
    error:    [ 'warn',    'خطأ'],
  };
  const [icon,txt]=map[st]||map.off;
  b.dataset.s=st;
  b.innerHTML=ic(icon)+'<span>'+esc(label||txt)+'</span>';
  b.title = st==='synced' ? ('متزامن — '+(SYNC.email||'')) : txt;
}

async function initSync(){
  const cfg=fbConfig();
  if(!cfg){ setSync('off'); return; }
  if(location.protocol==='file:'){ setSync('off','محليًا فقط'); return; }
  setSync('busy');
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.5/';
    const [app,auth,fs]=await Promise.all([
      import(V+'firebase-app.js'), import(V+'firebase-auth.js'), import(V+'firebase-firestore.js')]);
    SYNC.fb={app,auth,fs};
    const a=app.initializeApp(cfg);
    const A=auth.getAuth(a), D=fs.getFirestore(a);
    SYNC.auth=A; SYNC.db=D;

    try{ await auth.getRedirectResult(A); }catch(e){ /* لا نتيجة معلّقة */ }

    auth.onAuthStateChanged(A, async u=>{
      if(SYNC.unsub){ SYNC.unsub(); SYNC.unsub=null; }
      if(!u){ SYNC.uid=null; SYNC.email=null; setSync('signedout'); render(); return; }
      SYNC.uid=u.uid; SYNC.email=u.email||u.displayName||'';
      SYNC.ref=fs.doc(D,'users',u.uid);
      setSync('busy');
      render();   // من الصفحة التعريفية إلى رحلة الإعداد فور الدخول
      SYNC.unsub=fs.onSnapshot(SYNC.ref, snap=>{
        const d=snap.data();
        if(d && d.state && (+d.state.updatedAt||0) > (+S.updatedAt||0)){
          SYNC.applying=true;
          S=normalize(d.state); ensureMonth(S.current);
          document.documentElement.dataset.theme=S.theme||'dark';
          save({silent:true}); render();
          SYNC.applying=false;
          toast('وصلت تحديثات من جهاز آخر');
        }else if(!d){
          schedulePush(0);   // أول مزامنة — ارفع ما عندك
        }
        setSync('synced');
      }, err=>{ console.warn(err); setSync('error'); toast('تعذّر الاتصال بقاعدة البيانات','bad'); });
    }, err=>{ console.warn(err); setSync('error'); });
  }catch(e){ console.warn(e); setSync('error'); toast('تعذّر تحميل Firebase','bad'); }
}

function schedulePush(delay){
  if(!SYNC.ref || SYNC.applying) return;
  clearTimeout(SYNC.timer);
  SYNC.timer=setTimeout(async()=>{
    try{ await SYNC.fb.fs.setDoc(SYNC.ref,{state:S, updatedAt:Date.now()}); setSync('synced'); }
    catch(e){ console.warn(e); setSync('error'); }
  }, delay===0?0:900);
}

async function signIn(){
  if(!SYNC.auth){
    if(!fbConfig()){ toast('المزامنة غير مفعّلة — استخدم «جرّب بدون تسجيل»','bad'); return; }
    if(location.protocol==='file:'){ toast('تسجيل الدخول يحتاج فتح التطبيق من رابط الموقع','bad'); return; }
    toast('جارٍ تجهيز الاتصال — أعد المحاولة بعد لحظة','bad'); return;
  }
  const {GoogleAuthProvider,signInWithPopup,signInWithRedirect}=SYNC.fb.auth;
  const p=new GoogleAuthProvider();
  try{ await signInWithPopup(SYNC.auth,p); }
  catch(e){
    if(String(e.code||'').includes('popup')){ try{ await signInWithRedirect(SYNC.auth,p); }catch(e2){ toast('تعذّر تسجيل الدخول','bad'); } }
    else toast('تعذّر تسجيل الدخول: '+(e.code||e.message),'bad');
  }
}
async function signOutNow(){
  if(SYNC.auth) await SYNC.fb.auth.signOut(SYNC.auth);
  S.localMode=false; SHOW_ABOUT=true;      // الخروج يعيدك للصفحة الرئيسية
  save({silent:true}); closeModal(); navigate(); toast('خرجت من الحساب');
}

function itemColor(it){

    return h;

  const now=new Date(), ws=weekStart(now), a=iso(ws), b=iso(addDays(ws,6)), td=today();
  h+=wi.map(it=>{
    const bg=+it.weekly.budget||0, sp=spendBetween(it.id,a,b), left=bg-sp;

    const dayIdx=Math.round((now.setHours(0,0,0,0)-ws.getTime())/864e5);
    const daysLeft=Math.max(1,7-dayIdx);
    const perDay=left>0?left/daysLeft:0;

    return '<div class="card wk" style="--rc:'+rc+'">'+
      '<div class="wk-h"><span class="cell-ic" style="--ic-c:'+itemColor(it)+'">'+ic(it.icon)+'</span>'+

      '<div class="wk-body">'+
        '<div class="ring"><svg viewBox="0 0 120 120">'+
          '<circle class="trk" cx="60" cy="60" r="52"/>'+
          '<circle class="val" cx="60" cy="60" r="52" stroke-dasharray="'+(C*pct/100)+' '+C+'"/></svg>'+
          '<div class="mid"><b class="num">'+fmt(Math.abs(left))+'</b><s>'+(left<0?'تجاوز':'باقٍ')+' من '+fmt(bg)+'</s></div></div>'+
        '<div class="wk-side">'+
          '<div class="wk-kv"><span>الميزانية الأسبوعية</span><b class="num">'+fmt(bg)+' ريال</b></div>'+
          '<div class="wk-kv"><span>صرفت هذا الأسبوع</span><b class="num">'+fmt(sp)+' ريال</b></div>'+
          (left<0
            ? '<div class="wk-kv bad"><span>تجاوزت الميزانية</span><b class="num">'+fmt(-left)+' ريال</b></div>'
            : '<div class="wk-kv hi"><span>يمكنك صرف يوميًا حتى نهاية الأسبوع</span><b class="num">'+fmt(Math.round(perDay))+' ريال</b></div>')+
          '<div class="wk-kv"><span>صرفت اليوم</span><b class="num">'+fmt(spendOnDay(it.id,td))+' ريال</b></div>'+
        '</div></div>'+

      '<div class="days">'+[0,1,2,3,4,5,6].map(k=>{

          'data-act="addspend" data-item="'+it.id+'" data-date="'+d+'">'+

      }).join('')+'</div>'+

        return '<div class="wkchip'+(cur?' cur':'')+'"><s>الأسبوع '+(ix+1)+' · '+w.start.slice(5)+'</s>'+

  }).join('');
  h+='</div>';

  // سجل الصرف لهذا الشهر

    ? '<div class="card">'+logs.map(x=>{
        const it=itemById(x.item);
        return '<div class="log"><span class="cell-ic" style="--ic-c:'+(it?itemColor(it):'var(--txt3)')+'">'+
          ic(it?it.icon:'wallet')+'</span><span class="nm"><b>'+esc(x.note||(it?it.name:'مصروف'))+'</b>'+

  const it=id?itemById(id):null;

function roomIn(pid){
  const own=MODAL&&MODAL.id?(+(itemById(MODAL.id).alloc[pid])||0):0;
  return (+payById(pid).amount||0)-(allocOf(pid)-own);
}
function isOver(){ return S.incomes.some(p=>(+MODAL.draft.alloc[p.id]||0)>roomIn(p.id)); }

function syncItemDraft(){
  if(!MODAL||MODAL.kind!=='item') return;
  const n=$('#fName'), o=$('#fNote'), w=$('#fWeekly');
  if(n) MODAL.draft.name=n.value;
  if(o) MODAL.draft.note=o.value;
  if(w) MODAL.draft.weekly.budget=+w.value||0;
  document.querySelectorAll('[data-alloc]').forEach(i=>{ MODAL.draft.alloc[i.dataset.alloc]=+i.value||0; });
}

let WIZ=null;
const WIZ_STEPS=['الدخل','الالتزامات','الأسبوعي','مراجعة'];

function startWizard(){
  WIZ={ step:0,
    sources:[{id:'s1', label:'الراتب', day:1, amount:''}],
    picks:[],
    weeklyOn:false, weeklyItem:'', weeklyBudget:'' };
}

const wizTotalIncome = () => WIZ.sources.reduce((s,x)=>s+(+x.amount||0),0);
const wizTotalItems  = () => WIZ.picks.reduce((s,x)=>s+(+x.amount||0),0);

      'وإن كان يجيك على دفعات، أضف كل دفعة لتوزّع التزاماتك عليها بدقة.</p>'+
      '<div class="wiz-card">'+d.sources.map((s,i)=>

            '<input data-wsrc="label" data-i="'+i+'" value="'+esc(s.label)+'" placeholder="مثال: الراتب"></div>'+
          '<div class="f dy"><label>يوم الشهر</label>'+
            '<input data-wsrc="day" data-i="'+i+'" type="number" min="1" max="31" value="'+s.day+'"></div>'+
          '<div class="f am"><label>المبلغ (ريال)</label>'+

          (d.sources.length>1?'<button class="rm" data-act="wsrc-del" data-i="'+i+'" title="حذف">'+ic('trash')+'</button>':'')+
        '</div>').join('')+
        '<button class="btn sm" data-act="wsrc-add">'+ic('plus')+'مصدر دخل آخر</button>'+
        '<div class="alloctot" style="margin-top:13px"><span>مجموع الدخل الشهري</span>'+
        '<span class="num">'+fmt(wizTotalIncome())+' ريال</span></div>'+
      '</div>';

  else if(d.step===1){
    const chosen=new Set(d.picks.map(p=>p.name));
    body='<h2>وش التزاماتك الثابتة؟</h2>'+
      '<p class="lead">اختر البنود التي تتكرر عليك كل شهر، ثم حدّد مبلغ كل واحد. '+
      'تقدر تعدّلها أو تضيف غيرها في أي وقت بعد الإعداد.</p>'+
      '<div class="wiz-card"><div class="catgrid">'+CATALOG.map(c=>
        '<button class="catchip'+(chosen.has(c.name)?' on':'')+'" data-act="wcat" data-name="'+esc(c.name)+'" data-icon="'+c.icon+'">'+
        ic(c.icon)+'<span>'+esc(c.name)+'</span></button>').join('')+'</div>'+
        '<button class="btn sm" style="margin-top:13px" data-act="wcat-custom">'+ic('plus')+'بند مخصص</button></div>';

    if(d.picks.length){
      const multi=d.sources.length>1;
      body+='<div class="wiz-card">'+
        '<div class="pickhead"><b>'+d.picks.length+' بنود مختارة — اكتب مبلغ كل واحد</b>'+
        '<p>كم يكلّفك هذا البند في الشهر؟'+(multi?' ومن أي دفعة دخل يُخصم؟':'')+'</p></div>'+
        '<div class="picklabels"><span class="l1">البند</span>'+
          '<span class="l2">المبلغ الشهري (ريال)</span>'+
          (multi?'<span class="l3">يُخصم من</span>':'')+'</div>'+
        d.picks.map((p,i)=>
        '<div class="pickrow"><span class="cell-ic" style="--ic-c:var(--accent)">'+ic(p.icon)+'</span>'+
        '<span class="nm"><input data-wpick="name" data-i="'+i+'" value="'+esc(p.name)+'" placeholder="اسم البند"></span>'+
        '<input class="amt" data-wpick="amount" data-i="'+i+'" type="number" min="0" step="50" inputmode="decimal" '+
          'value="'+p.amount+'" placeholder="مثال: 500" aria-label="المبلغ الشهري لبند '+esc(p.name)+'">'+
        (multi

          ? '<p class="sub" style="text-align:center">اترك المبلغ صفرًا لو ما زلت لا تعرفه — تقدر تحدّده لاحقًا.</p>'

  else if(d.step===2){

      'التطبيق يحسب لك المتبقي وكم تقدر تصرف يوميًا حتى نهاية الأسبوع. خطوة اختيارية تمامًا.</p>'+
      (cands.length
        ? '<div class="wiz-card"><div class="switch'+(d.weeklyOn?' on':'')+'" data-act="wweekly-tog">'+
          '<span class="track"></span><span class="lb">فعّل المتابعة الأسبوعية'+
          '<s>يظهر لك تبويب «الأسبوعي» بحلقة تتبّع ملوّنة</s></span></div>'+
          (d.weeklyOn
            ? '<div style="margin-top:13px"><div class="field"><label>البند</label>'+
              '<select class="inp" data-act="none" id="wkItem">'+cands.map(p=>

            : '')+
          '</div>'
        : '<div class="wiz-card"><div class="hint" style="text-align:center;padding:14px 0">'+
          'تحتاج بندًا واحدًا على الأقل بمبلغ أكبر من صفر. تقدر تفعّلها لاحقًا من «البنود ← تعديل».</div></div>');

  else{
    const inc=wizTotalIncome(), com=wizTotalItems(), free=inc-com;
    body='<h2>راجع وابدأ</h2>'+
      '<p class="lead">هذي صورة شهرك. كل شيء قابل للتعديل بعد الإعداد.</p>'+
      '<div class="wiz-card" style="padding:0;overflow:hidden">'+
        '<div class="rev"><span>مصادر الدخل</span><b class="num">'+d.sources.length+'</b></div>'+
        '<div class="rev"><span>الدخل الشهري</span><b class="num">'+fmt(inc)+' ريال</b></div>'+
        '<div class="rev"><span>البنود الثابتة</span><b class="num">'+d.picks.length+'</b></div>'+
        '<div class="rev"><span>مجموع الالتزامات</span><b class="num">'+fmt(com)+' ريال</b></div>'+
        '<div class="rev big"><span>المتبقي الحر</span>'+
          '<b class="num '+(free<0?'r':'g')+'">'+fmt(free)+' ريال</b></div>'+
      '</div>'+
      (free<0
        ? '<div class="note" style="--nc:var(--danger);margin-top:13px">'+ic('warn','big')+
          '<div><b>التزاماتك تتجاوز دخلك</b><p>الفرق <span class="num">'+fmt(-free)+'</span> ريال. '+
          'تقدر تكمل الآن وتعدّل المبالغ لاحقًا، أو ترجع للخلف وتراجعها.</p></div></div>'
        : inc>0
        ? '<div class="note" style="--nc:var(--accent);margin-top:13px">'+ic('check','big')+
          '<div><b>جاهز</b><p>يتبقى لك <span class="num">'+fmt(free)+'</span> ريال حرة شهريًا للادخار أو الطوارئ.</p></div></div>'
        : '');
  }

  const last=d.step===WIZ_STEPS.length-1;
  return '<div class="wiz">'+
    '<div class="wiz-top"><div class="brand-mark"><svg class="ic" viewBox="0 0 24 24">'+
      '<path d="M3 8.6h18v11.2H3z"/><path d="M3 8.6 6.4 4.6h11.2L21 8.6"/><circle cx="16.6" cy="14.2" r="1.6"/></svg></div>'+
      '<div class="t"><b>إعداد مصاريفي</b><span>خطوة '+(d.step+1)+' من '+WIZ_STEPS.length+' · '+WIZ_STEPS[d.step]+'</span></div>'+
      (SYNC.email?'<span class="hint">'+esc(SYNC.email)+'</span>':'')+'</div>'+
    '<div class="wiz-dots">'+WIZ_STEPS.map((_,i)=>
      '<i class="'+(i===d.step?'on':i<d.step?'done':'')+'"></i>').join('')+'</div>'+
    body+
    '<div class="wiz-foot">'+
      (d.step>0?'<button class="btn" data-act="wback">'+ic('x')+'رجوع</button>':'')+
      '<button class="btn primary" data-act="wnext">'+(last?ic('check')+'ابدأ الاستخدام':'التالي '+ic('check'))+'</button>'+
      '<span class="sp"></span>'+
      (d.step===1||d.step===2?'<button class="wiz-skip" data-act="wskip">تخطّي</button>':'')+

function readWizInputs(){
  if(!WIZ) return;
  document.querySelectorAll('[data-wsrc]').forEach(el=>{
    const s=WIZ.sources[+el.dataset.i]; if(!s) return;
    const k=el.dataset.wsrc;
    s[k] = k==='label' ? el.value : el.value;
  });
  document.querySelectorAll('[data-wpick]').forEach(el=>{
    const p=WIZ.picks[+el.dataset.i]; if(!p) return;
    p[el.dataset.wpick]=el.value;
  });
  const wi=$('#wkItem'), wb=$('#wkBudget');
  if(wi) WIZ.weeklyItem=wi.value;
  if(wb) WIZ.weeklyBudget=wb.value;
}

function wizValidate(){
  const d=WIZ;
  if(d.step===0){
    readWizInputs();
    d.sources.forEach(s=>{ if(!String(s.label).trim()) s.label='دخل'; });
    if(!d.sources.length){ toast('أضف مصدر دخل واحدًا على الأقل','bad'); return false; }
    if(wizTotalIncome()<=0){ toast('اكتب مبلغ دخلك','bad'); return false; }
    const bad=d.sources.find(s=>{ const n=+s.day; return !(n>=1&&n<=31); });
    if(bad){ toast('يوم الشهر لازم يكون بين ١ و٣١','bad'); return false; }
  }
  if(d.step===1){
    readWizInputs();
    d.picks=d.picks.filter(p=>String(p.name).trim());
  }
  if(d.step===2) readWizInputs();
  return true;
}

function finishWizard(){
  readWizInputs();
  const m=ym(new Date());
  const st=emptyState();
  st.theme=S.theme; st.localMode=S.localMode; st.onboarded=true; st.current=m;

  st.incomes=WIZ.sources.map((s,i)=>({
    id:s.id, label:String(s.label).trim()||'دخل',
    day:Math.min(31,Math.max(1,+s.day||1)),
    amount:+s.amount||0, color:SRC_COLORS[i%SRC_COLORS.length]
  }));

  const first=st.incomes[0].id;
  st.items=WIZ.picks.map((p,i)=>{
    const alloc={}; st.incomes.forEach(x=>alloc[x.id]=0);
    const target = (WIZ.sources.length>1 && p.src) ? p.src : first;
    alloc[target in alloc ? target : first] = +p.amount||0;
    const on = WIZ.weeklyOn && p.name===WIZ.weeklyItem;
    return { id:'i_'+Date.now().toString(36)+i, name:String(p.name).trim(), icon:p.icon||'wallet',
      note:'', alloc, archived:false,
      weekly:{ enabled:!!on, budget: on ? (+WIZ.weeklyBudget||Math.round((+p.amount||0)/4)) : 0 } };
  });

  S=st; WIZ=null; TAB='over'; SHOW_ABOUT=false;
  save(); navigate();
  toast('تم الإعداد — ابدأ متابعة شهرك');
}

/* ═══════════════════════════════════════════════════════════
   العرض
   ═══════════════════════════════════════════════════════════ */
/* ── التوجيه عبر العنوان: كل قسم له رابط، وزر الرجوع يعمل ── */
const ROUTES={over:'overview', week:'weekly', pays:'income', items:'items', extra:'extras', arch:'archive'};
const R2TAB=Object.fromEntries(Object.entries(ROUTES).map(([k,v])=>[v,k]));
let SHOW_ABOUT=false;

function currentScreen(){
  if(SHOW_ABOUT) return 'landing';
  if(S.onboarded) return 'app';
  if(WIZ || SYNC.uid || S.localMode) return 'wizard';
  return 'landing';
}

function hashFor(){
  const sc=currentScreen();
  return sc==='landing' ? '#/about' : sc==='wizard' ? '#/setup' : '#/'+(ROUTES[TAB]||'overview');
}

/* يقرأ العنوان ويضبط الحالة عليه */
function applyHash(){
  const h=(location.hash||'').replace(/^#\/?/,'').trim();
  if(h==='about'){ SHOW_ABOUT=true; return; }
  SHOW_ABOUT=false;
  if(h==='setup'){ if(!S.onboarded && !WIZ) startWizard(); return; }
  if(R2TAB[h] && S.onboarded) TAB=R2TAB[h];
}

/* يغيّر العنوان ليطابق الحالة ثم يعرض فورًا (hashchange لاحقًا لا يضرّ — applyHash يقرأ نفس القيمة) */
function navigate(){
  const h=hashFor();
  if(location.hash!==h) location.hash=h;
  render();
}
window.addEventListener('hashchange',()=>{ applyHash(); render(); });

function render(){
  const sc=currentScreen();
  const chrome = sc==='app';
  $('.topbar').style.display = chrome ? '' : 'none';
  $('#fab').style.display = chrome ? '' : 'none';

  const h=hashFor();
  if(location.hash!==h) history.replaceState(null,'',h);
  document.title = sc==='app'
    ? 'مصاريفي — '+(TABS.find(t=>t.id===TAB)||{}).label
    : sc==='wizard' ? 'مصاريفي — الإعداد' : 'مصاريفي';

  if(sc==='landing'){ $('#app').innerHTML=viewLanding(); return; }
  if(sc==='wizard'){ if(!WIZ) startWizard(); $('#app').innerHTML=viewWizard(); return; }

  renderTabs();
  $('#app').innerHTML = TAB==='over'?viewOverview():TAB==='week'?viewWeek():TAB==='pays'?viewPays()
    :TAB==='items'?viewItems():TAB==='extra'?viewExtras():viewArchive();
  $('#mLbl').textContent=monthLabel(S.current);
  $('#mLbl').classList.toggle('now',S.current===ym(new Date()));
}

/* ═══════════════════════════════════════════════════════════
   الأحداث
   ═══════════════════════════════════════════════════════════ */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]');
  if(t){ TAB=t.dataset.tab; navigate(); return; }
  if(e.target.matches('[data-ov]')){ closeModal(); return; }

  const ib=e.target.closest('[data-icon]');
  if(ib&&MODAL&&MODAL.kind==='item'){ syncItemDraft(); MODAL.draft.icon=ib.dataset.icon; drawItemModal(); return; }
  const xb=e.target.closest('[data-xicon]');
  if(xb&&MODAL&&MODAL.kind==='extra'){
    MODAL.draft.icon=xb.dataset.xicon;
    document.querySelectorAll('[data-xicon]').forEach(b=>b.classList.toggle('on',b.dataset.xicon===MODAL.draft.icon));
    return;
  }

  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act, itemId=b.dataset.item, payId=b.dataset.pay, xId=b.dataset.x, spId=b.dataset.sp;

  switch(a){
    case 'toggle':{ const m=M(); (m.paid[itemId]=m.paid[itemId]||{})[payId]=!isPaid(itemId,payId); save(); render(); break; }
    case 'xtoggle':{ const x=M().extras.find(v=>v.id===xId); if(x){ x.paid=!x.paid; save(); render(); } break; }

    /* ---------- الصفحة التعريفية ورحلة الإعداد ---------- */
    case 'try-local':{
      S.localMode=true; SHOW_ABOUT=false; save();
      if(!S.onboarded) startWizard();
      navigate(); break;
    }
    case 'back-to-app':{ SHOW_ABOUT=false; navigate(); break; }
    case 'wsrc-add':{
      readWizInputs();
      WIZ.sources.push({id:'s'+(Date.now().toString(36)), label:'دخل إضافي', day:1, amount:''});
      render(); break;
    }
    case 'wsrc-del':{
      readWizInputs();
      const i=+b.dataset.i, gone=WIZ.sources[i];
      WIZ.sources.splice(i,1);
      WIZ.picks.forEach(p=>{ if(p.src===gone.id) p.src=WIZ.sources[0].id; });
      render(); break;
    }
    case 'wcat':{
      readWizInputs();
      const nm=b.dataset.name, ix=WIZ.picks.findIndex(p=>p.name===nm);
      if(ix>=0) WIZ.picks.splice(ix,1);
      else WIZ.picks.push({name:nm, icon:b.dataset.icon, amount:'', src:WIZ.sources[0].id});
      render(); break;
    }
    case 'wcat-custom':{
      readWizInputs();
      WIZ.picks.push({name:'', icon:'wallet', amount:'', src:WIZ.sources[0].id});
      render();
      const rows=document.querySelectorAll('[data-wpick="name"]');
      if(rows.length) rows[rows.length-1].focus();
      break;
    }
    case 'wpick-del':{ readWizInputs(); WIZ.picks.splice(+b.dataset.i,1); render(); break; }
    case 'wweekly-tog':{
      readWizInputs();
      WIZ.weeklyOn=!WIZ.weeklyOn;
      if(WIZ.weeklyOn){
        const cands=WIZ.picks.filter(p=>(+p.amount||0)>0);
        const pref=[/شخصي/,/أكل|مطاعم/,/قهوة/,/بقالة/]
          .reduce((f,re)=>f||cands.find(p=>re.test(p.name)), null) || cands[0];
        if(pref && !WIZ.weeklyItem) WIZ.weeklyItem=pref.name;
        if(pref && !WIZ.weeklyBudget) WIZ.weeklyBudget=Math.round((+pref.amount||0)/4);
      }
      render(); break;
    }
    case 'wback':{ readWizInputs(); WIZ.step--; render(); break; }
    case 'wskip':{ readWizInputs(); WIZ.step++; render(); break; }
    case 'wnext':{
      if(!wizValidate()) return;
      if(WIZ.step===WIZ_STEPS.length-1) finishWizard();
      else { WIZ.step++; render(); }
      break;
    }
    case 'resetup':{
      modalConfirm('إعادة الإعداد','ستبدأ رحلة الإعداد من جديد وتُستبدل مصادر دخلك وبنودك الحالية. '+
        'سجلات الدفع والصرف تبقى محفوظة. صدّر نسخة احتياطية أولًا لو تبي.','أعد الإعداد','do-resetup');
      break;
    }

    case 'add':  modalItem(null); break;
    case 'edit': modalItem(itemId); break;
    case 'addx': modalExtra(); break;
    case 'addspend': modalSpend(itemId,b.dataset.date); break;
    case 'settings': modalSettings(); break;
    case 'close': closeModal(); break;
    case 'signin': signIn(); break;
    case 'signout': signOutNow(); break;

    case 'togweekly':{
      syncItemDraft();
      const w=MODAL.draft.weekly;
      w.enabled=!w.enabled;
      if(w.enabled&&!w.budget){
        const tot=S.incomes.reduce((s,p)=>s+(+MODAL.draft.alloc[p.id]||0),0);
        w.budget=tot?Math.round(tot/4):150;
      }
      drawItemModal(); break;
    }
    case 'save-item':{
      syncItemDraft();
      const d=MODAL.draft;
      if(!d.name.trim()){ toast('اكتب اسم البند','bad'); $('#fName').focus(); return; }
      if(d.weekly.enabled&&d.weekly.budget<=0){ toast('حدّد الحد الأسبوعي','bad'); return; }
      const ix=S.items.findIndex(x=>x.id===d.id);
      if(ix>=0) Object.assign(S.items[ix],d); else S.items.push(d);
      save(); closeModal(); render(); toast('حُفظ «'+d.name+'»'); break;
    }
    case 'save-spend':{
      const d=MODAL.draft;
      d.amount=+$('#sAmt').value||0; d.item=$('#sItem').value;
      d.date=$('#sDate').value||today(); d.note=$('#sNote').value.trim();
      if(d.amount<=0){ toast('اكتب مبلغًا أكبر من صفر','bad'); $('#sAmt').focus(); return; }
      if(!d.item){ toast('اختر البند','bad'); return; }
      S.spend.push(d); save(); closeModal();
      if(TAB!=='week'&&TAB!=='over') TAB='week';
      render();
      const it=itemById(d.item), ws=weekStart(parseISO(d.date));
      const left=(+it.weekly.budget||0)-spendBetween(it.id,iso(ws),iso(addDays(ws,6)));
      toast(it.weekly.enabled
        ? (left>=0?'سُجّل — باقي لك '+fmt(left)+' ريال هذا الأسبوع':'سُجّل — تجاوزت بـ '+fmt(-left)+' ريال')
        : 'سُجّل المصروف');
      break;
    }
    case 'spdel':{ S.spend=S.spend.filter(x=>x.id!==spId); save(); render(); toast('حُذف السجل'); break; }
    case 'save-extra':{
      const d=MODAL.draft;
      d.name=$('#xName').value.trim(); d.amount=+$('#xAmt').value||0; d.pay=$('#xPay').value;
      if(!d.name){ toast('اكتب وصف المصروف','bad'); return; }
      if(d.amount<=0){ toast('اكتب مبلغًا أكبر من صفر','bad'); return; }
      M().extras.push(d); save(); closeModal(); render(); toast('أُضيف المصروف الطارئ'); break;
    }

    case 'incadd':{
      const id='p_'+Date.now().toString(36);
      const colors=['#2FCE65','#5aa9f7','#f5a524','#c084fc','#fb7185','#2dd4bf'];
      readIncomeInputs();
      S.incomes.push({id,label:'دخل جديد',day:1,amount:0,color:colors[S.incomes.length%colors.length]});
      S.items.forEach(i=>i.alloc[id]=0);
      save(); modalSettings(); break;
    }
    case 'incdel':{
      if(S.incomes.length<=1){ toast('لا يمكن حذف آخر دفعة دخل','bad'); return; }
      const p=payById(payId), used=allocOf(payId);
      readIncomeInputs();
      modalConfirm('حذف دفعة دخل',
        'ستُحذف <b>'+esc(p.label)+'</b>'+(used>0
          ? '، وستُصفّر المبالغ الموزّعة عليها (<b class="num">'+fmt(used)+'</b> ريال) في كل البنود. راجع توزيعك بعدها.'
          : '.'),'احذفها','do-incdel',payId);
      break;
    }
    case 'save-settings':{ readIncomeInputs(); save(); closeModal(); render(); toast('حُفظت الإعدادات'); break; }

    case 'fbsave':{
      const raw=$('#fbCfg').value.trim();
      if(!raw){ toast('الصق الإعداد أولًا','bad'); return; }
      try{
        const o=JSON.parse(raw.replace(/^\s*(const|var|let)\s+\w+\s*=\s*/,'').replace(/;\s*$/,''));
        if(!o.apiKey||!o.projectId) throw new Error('ناقص');
        localStorage.setItem(FBKEY,JSON.stringify(o));
        toast('حُفظ الإعداد — جارٍ الاتصال');
        closeModal(); initSync();
      }catch(err){ toast('الإعداد غير صالح — تأكد أنه JSON فيه apiKey و projectId','bad'); }
      break;
    }
    case 'fbclear':{ localStorage.removeItem(FBKEY); closeModal(); setSync('off'); toast('مُسح إعداد المزامنة'); break; }

    case 'archive':{
      const it=itemById(itemId);
      modalConfirm('أرشفة الالتزام','سيُنقل <b>'+esc(it.name)+'</b> إلى «المنتهية»، ويصير مبلغه <b class="num">'+
        fmt(itemTotal(it))+'</b> ريال ضمن المبلغ الحر. تقدر ترجّعه وقت ما تبي.','أرشفه','do-archive',itemId); break;
    }
    case 'restore':{ const it=itemById(itemId); it.archived=false; delete it.archivedAt; save(); render(); toast('رجع «'+it.name+'»'); break; }
    case 'del':{
      const it=itemById(itemId);
      const n=S.spend.filter(x=>x.item===itemId).length;
      modalConfirm('حذف نهائي','سيُحذف <b>'+esc(it.name)+'</b> وكل سجل دفعه'+
        (n?' و<b class="num">'+n+'</b> عملية صرف مسجّلة عليه':'')+'. لا يمكن التراجع.','احذف','do-del',itemId); break;
    }
    case 'confirm-yes':{
      const {act:ca,payload}=MODAL;
      if(ca==='do-archive'){ const it=itemById(payload); it.archived=true; it.archivedAt=S.current;
        save(); closeModal(); render(); toast('أُرشف «'+it.name+'»'); }
      else if(ca==='do-del'){ const it=itemById(payload);
        S.items=S.items.filter(x=>x.id!==payload);
        S.spend=S.spend.filter(x=>x.item!==payload);
        Object.values(S.months).forEach(m=>{ delete m.paid[payload]; });
        save(); closeModal(); render(); toast('حُذف «'+it.name+'»'); }
      else if(ca==='do-incdel'){
        S.incomes=S.incomes.filter(p=>p.id!==payload);
        S.items.forEach(i=>{ delete i.alloc[payload]; });
        Object.values(S.months).forEach(m=>{
          Object.values(m.paid).forEach(o=>{ delete o[payload]; });
          m.extras=m.extras.filter(x=>x.pay!==payload);
        });
        save(); closeModal(); render(); toast('حُذفت الدفعة'); }
      else if(ca==='do-resetup'){
        S.onboarded=false; SHOW_ABOUT=false; startWizard(); save(); closeModal(); navigate();
      }
      else if(ca==='do-reset'){
        const keepTheme=S.theme;
        localStorage.removeItem(KEY);
        S=emptyState(); S.theme=keepTheme;
        WIZ=null; save(); closeModal(); render(); toast('أُعيد الضبط بالكامل');
      }
      break;
    }
    case 'clearpaid':{ M().paid={}; M().extras.forEach(x=>x.paid=false); save(); closeModal(); render(); toast('أُلغيت علامات الدفع'); break; }
    case 'reset': modalConfirm('حذف كل البيانات','ستُحذف كل البنود والسجلات وتعود البيانات الأصلية. لا يمكن التراجع.','احذف الكل','do-reset'); break;
    case 'export': doExport(); break;
    case 'import': doImport(); break;
  }
});

function readIncomeInputs(){
  document.querySelectorAll('[data-inc-row]').forEach(row=>{
    const id=row.dataset.incRow, p=payById(id); if(!p) return;
    const l=row.querySelector('[data-inc-label]'), d=row.querySelector('[data-inc-day]'), m=row.querySelector('[data-inc-amt]');
    if(l&&l.value.trim()) p.label=l.value.trim();
    if(d) p.day=Math.min(31,Math.max(1,+d.value||1));
    if(m) p.amount=+m.value||0;
  });
}

document.addEventListener('input',e=>{
  if(e.target.matches('[data-alloc]')&&MODAL&&MODAL.kind==='item'){
    syncItemDraft();
    const tot=S.incomes.reduce((s,p)=>s+(+MODAL.draft.alloc[p.id]||0),0), over=isOver(), box=$('.alloctot');
    if(box){ box.classList.toggle('over',over);
      box.children[0].textContent=over?'التوزيع يتجاوز المتاح في إحدى الدفعات':'المجموع الشهري';
      box.children[1].textContent=fmt(tot)+' ريال'; }
  }
  if(e.target.matches('[data-inc-amt]')){
    let t=0; document.querySelectorAll('[data-inc-amt]').forEach(i=>t+=+i.value||0);
    const el=$('#incTot'); if(el) el.textContent=fmt(t)+' ريال';
  }
});

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&MODAL) closeModal();
  if(e.key==='Enter'&&MODAL&&!e.shiftKey&&e.target.tagName!=='TEXTAREA'){
    const k={spend:'save-spend',extra:'save-extra'}[MODAL.kind];
    if(k){ const btn=$('[data-act="'+k+'"]'); if(btn){ e.preventDefault(); btn.click(); } }
  }
});

$('#mPrev').onclick=()=>{ S.current=shiftMonth(S.current,-1); ensureMonth(S.current); save(); render(); };
$('#mNext').onclick=()=>{ S.current=shiftMonth(S.current,1);  ensureMonth(S.current); save(); render(); };
$('#bHome').onclick=()=>{ SHOW_ABOUT=true; navigate(); };
$('#bSettings').onclick=()=>modalSettings();
$('#fab').onclick=()=>modalSpend();
$('#bSync').onclick=()=>{ if(SYNC.status==='signedout') signIn(); else modalSettings(); };
$('#bTheme').onclick=()=>{ S.theme=S.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=S.theme; save(); };

/* ═══════════════════════════════════════════════════════════
   تصدير / استيراد
   ═══════════════════════════════════════════════════════════ */
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='مصاريفي-'+S.current+'.json'; a.click();
  URL.revokeObjectURL(a.href); toast('صُدّرت نسخة احتياطية');
}
function doImport(){
  const inp=document.createElement('input'); inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const d=JSON.parse(r.result);
        if(!d.items||!d.incomes) throw new Error('ملف غير صالح');
        S=normalize(d); ensureMonth(S.current);
        document.documentElement.dataset.theme=S.theme||'dark';
        save(); closeModal(); render(); toast('استُوردت البيانات');
      }catch(err){ toast('الملف غير صالح','bad'); } };
    r.readAsText(f);
  };
  inp.click();
}

/* ═══════════════════════════════════════════════════════════
   البدء
   ═══════════════════════════════════════════════════════════ */
load();
save({silent:true});
setSync('off');
applyHash();
render();
initSync();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
